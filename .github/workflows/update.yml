name: Update credits
on:
  push:
    paths: ["credits.json"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node build.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      - run: |
          git config user.name "credits-bot"
          git config user.email "credits-bot@users.noreply.github.com"
          git add data.js covers
          git diff --cached --quiet || (git commit -m "Update credits and cover art" && git push)
